<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Sonu Goswami, Senior Salesforce Developer</title>
  <desc id="d">I build the complex side of Salesforce. Animated diagram of an AI document allocation pipeline: Upload, S3, AI classify, Queueable, then checklist bins.</desc>
  <defs>
    <radialGradient id="glow" cx="85%" cy="0%" r="70%">
      <stop offset="0" stop-color="#1d2a4d"/>
      <stop offset="1" stop-color="#0c1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="0.5" stop-color="#ff7d6e">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ffb547"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#131b2e"/>
      <stop offset="1" stop-color="#18223a"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .edge { stroke: #2f3b5c; stroke-width: 2; stroke-dasharray: 6 8; fill: none; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .lbl { fill: #9aa5bf; font-size: 12px; font-weight: 600; }
      @media (prefers-reduced-motion: reduce) { .edge { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="20" fill="#0c1220"/>
  <rect width="1200" height="400" rx="20" fill="url(#glow)"/>

  <!-- left: text -->
  <g class="mono" font-size="15" font-weight="600" letter-spacing="2.5" fill="#ffb547">
    <text x="60" y="88">SENIOR SALESFORCE DEVELOPER</text>
  </g>
  <g class="sans" font-weight="800" font-size="56" letter-spacing="-1.5">
    <text x="58" y="158" fill="#eef1f8">I build the</text>
    <text x="58" y="222" fill="url(#hl)">complex side</text>
    <text x="58" y="286" fill="#eef1f8">of Salesforce.</text>
  </g>
  <text class="mono" x="60" y="330" font-size="15" fill="#9aa5bf">Async Apex · LWC · API integrations · Data models</text>
  <g class="sans" font-size="14" font-weight="600">
    <rect x="60" y="348" width="196" height="30" rx="15" fill="#0c1220" stroke="#2e9bff"/>
    <text x="158" y="368" text-anchor="middle" fill="#2e9bff">4x Salesforce Certified</text>
    <rect x="266" y="348" width="186" height="30" rx="15" fill="#0c1220" stroke="#2e9bff"/>
    <text x="359" y="368" text-anchor="middle" fill="#2e9bff">Platform Developer II</text>
  </g>

  <!-- right: pipeline panel -->
  <rect x="660" y="36" width="500" height="328" rx="18" fill="url(#panel)" stroke="#26314d"/>
  <text class="mono" x="682" y="64" font-size="12" fill="#9aa5bf">AI document allocation · async pipeline</text>
  <g class="mono" font-size="12" fill="#4fd1a5">
    <circle cx="1078" cy="60" r="4" fill="#4fd1a5">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1088" y="64">running</text>
  </g>
  <rect x="676" y="78" width="468" height="270" rx="12" fill="#0c1220"/>

  <!-- edges -->
  <path class="edge" d="M712,220 L800,130 L900,262 L996,160"/>
  <path class="edge" d="M996,160 L1068,112"/>
  <path class="edge" d="M996,160 L1068,206"/>
  <path class="edge" d="M996,160 L1068,300"/>

  <!-- nodes -->
  <g>
    <circle cx="712" cy="220" r="15" fill="#0c1220" stroke="#2e9bff" stroke-width="2.5"/><circle cx="712" cy="220" r="5" fill="#2e9bff"/>
    <circle cx="800" cy="130" r="15" fill="#0c1220" stroke="#2e9bff" stroke-width="2.5"/><circle cx="800" cy="130" r="5" fill="#2e9bff"/>
    <circle cx="900" cy="262" r="15" fill="#0c1220" stroke="#ffb547" stroke-width="2.5"/><circle cx="900" cy="262" r="5" fill="#ffb547"/>
    <circle cx="996" cy="160" r="15" fill="#0c1220" stroke="#2e9bff" stroke-width="2.5"/><circle cx="996" cy="160" r="5" fill="#2e9bff"/>
  </g>
  <g class="mono lbl" text-anchor="middle">
    <text x="712" y="254">Upload</text>
    <text x="800" y="106">S3</text>
    <text x="900" y="296">AI classify</text>
    <text x="996" y="136">Queueable</text>
  </g>

  <!-- bins -->
  <g class="mono" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="1068" y="97" width="48" height="30" rx="8" fill="#0c1220" stroke="#5fd4f4" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;4;2" keyTimes="0;0.92;0.96;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="1068" y="191" width="48" height="30" rx="8" fill="#0c1220" stroke="#4fd1a5" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;4;2" keyTimes="0;0.92;0.96;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1068" y="285" width="48" height="30" rx="8" fill="#0c1220" stroke="#ff7d6e" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;4;2" keyTimes="0;0.92;0.96;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g class="mono lbl" text-anchor="middle" font-size="11">
    <text x="1092" y="143">Appraisal</text>
    <text x="1092" y="237">Insurance</text>
    <text x="1092" y="331">Bank stmt</text>
  </g>

  <!-- documents: each follows the pipeline, turns its bin's colour after AI classify -->
  <g id="doc-a">
    <rect x="-7" y="-9" width="14" height="18" rx="3" fill="#eef1f8">
      <animate attributeName="fill" values="#eef1f8;#eef1f8;#5fd4f4;#5fd4f4" keyTimes="0;0.55;0.6;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="1.6" fill="#0c1220"/><rect x="-4" y="0" width="8" height="1.6" fill="#0c1220"/><rect x="-4" y="4" width="5" height="1.6" fill="#0c1220"/>
    <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M712,220 L800,130 L900,262 L996,160 L1092,112" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
  </g>
  <g>
    <rect x="-7" y="-9" width="14" height="18" rx="3" fill="#eef1f8">
      <animate attributeName="fill" values="#eef1f8;#eef1f8;#4fd1a5;#4fd1a5" keyTimes="0;0.55;0.6;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="1.6" fill="#0c1220"/><rect x="-4" y="0" width="8" height="1.6" fill="#0c1220"/><rect x="-4" y="4" width="5" height="1.6" fill="#0c1220"/>
    <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M712,220 L800,130 L900,262 L996,160 L1092,206"/>
  </g>
  <g>
    <rect x="-7" y="-9" width="14" height="18" rx="3" fill="#eef1f8">
      <animate attributeName="fill" values="#eef1f8;#eef1f8;#ff7d6e;#ff7d6e" keyTimes="0;0.49;0.54;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-4" y="-4" width="8" height="1.6" fill="#0c1220"/><rect x="-4" y="0" width="8" height="1.6" fill="#0c1220"/><rect x="-4" y="4" width="5" height="1.6" fill="#0c1220"/>
    <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M712,220 L800,130 L900,262 L996,160 L1092,300"/>
  </g>
</svg>
